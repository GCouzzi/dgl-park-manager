  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">E-Estacionamento</a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="#">Home</a>
              </li>

              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle active"
                  href="#"
                  data-bs-toggle="dropdown"
                >
                  Cadastros
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="cadastro-modelo.html"
                      >Modelo</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="cadastro-veiculo.html"
                      >Veículo</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item active" href="cadastro-despesa.html"
                      >Despesa</a
                    >
                  </li>
                </ul>
              </li>

              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  data-bs-toggle="dropdown"
                >
                  Processos
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="cadastro-saida.html"
                      >Saída</a
                    >
                  </li>
                </ul>
              </li>

              <li class="nav-item dropdown">
                <a
                  class="nav-link dropdown-toggle"
                  href="#"
                  data-bs-toggle="dropdown"
                >
                  Relatórios
                </a>
                <ul class="dropdown-menu">
                  <li>
                    <a class="dropdown-item" href="relatorio-media-saida.html"
                      >Média por Saída</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="relatorio-total-usuario.html"
                      >Total por Usuário</a
                    >
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-fluid flex-grow-1 d-flex flex-column">
      <div class="row flex-grow-1">
        <aside
          class="col-12 col-md-2 col-xl-3 col-xxl-2 border-end border-1 mb-5 mb-md-0"
        >
          <nav class="d-flex flex-column gap-2 mt-5">
            <a
              href="cadastro-despesa.html"
              class="btn btn-primary active text-start"
            >
              <i class="bi bi-plus-circle-fill me-2"></i>Inserir
            </a>
            <a href="listar-despesa.html" class="btn btn-primary text-start">
              <i class="bi bi-list-ul me-2"></i>Listar
            </a>
            <a href="buscar-despesa.html" class="btn btn-primary text-start">
              <i class="bi bi-search me-2"></i>Buscar
            </a>
          </nav>
        </aside>

        <section class="col-12 col-md-10 col-xl-9 col-xxl-10 p-5">
          <form method="post">
            <div class="card shadow-sm">
              <div class="card-header p-4 bg-primary text-white">
                <h1 class="display-6">Inserir Despesa</h1>
              </div>

              <div class="card-body">
                <div class="row g-3">
                  <div class="form-floating col-12">
                    <input
                      type="text"
                      class="form-control"
                      id="descricao"
                      placeholder="Descrição"
                    />
                    <label for="descricao">
                      <i class="bi bi-card-text me-2"></i>Descrição
                    </label>
                  </div>

                  <div class="form-floating col-12">
                    <input
                      type="number"
                      class="form-control"
                      id="valor"
                      placeholder="Valor"
                      step="0.01"
                      min="0"
                    />
                    <label for="valor">
                      <i class="bi bi-currency-dollar me-2"></i>Valor
                    </label>
                  </div>

                  <div class="form-floating col-12">
                    <input
                      type="date"
                      class="form-control"
                      id="vencimento"
                      placeholder="Vencimento"
                    />
                    <label for="vencimento">
                      <i class="bi bi-calendar-event-fill me-2"></i>Vencimento
                    </label>
                  </div>

                  <div class="form-floating col-12">
                    <select class="form-select" id="status">
                      <option selected disabled>Selecione o status</option>
                      <option value="pago">Pago</option>
                      <option value="nao_pago">Não Pago</option>
                    </select>
                    <label for="status">
                      <i class="bi bi-check-circle-fill me-2"></i>Status
                    </label>
                  </div>

                  <div class="form-floating col-12">
                    <input
                      type="text"
                      class="form-control-plaintext"
                      id="criador"
                      placeholder="Criador"
                      readonly
                    />
                    <label for="criador">
                      <i class="bi bi-person-fill me-2"></i>Criador
                    </label>
                  </div>

                  <div class="col-12">
                    <button type="button" class="btn btn-success w-100">
                      <i class="bi bi-save me-2"></i>Salvar
                    </button>
                  </div>

                  <div class="col-12">
                    <button type="reset" class="btn btn-warning w-100">
                      <i class="bi bi-x-circle me-2"></i>Limpar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="bg-primary text-white mt-auto py-4" data-bs-theme="dark">
      <div class="container text-center">
        <p class="small mb-0">© 2026 GDL, Inc • v1.0.0</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
