<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — E-Estacionamento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

  <main class="container-fluid flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4 col-xl-3">
      <div class="card shadow-sm">
        <div class="card-header p-4 bg-primary text-white text-center">
          <h1 class="display-6 mb-0">
            <i class="bi bi-p-circle-fill me-2"></i>E-Estacionamento
          </h1>
        </div>

        <div class="card-body p-4">
          <h2 class="h5 text-muted text-center mb-4">Entrar no Sistema</h2>
          <form method="post" action="#">
            <div class="row g-3">

              <div class="form-floating col-12">
                <input type="text" class="form-control" id="nomeUsuario" placeholder="Nome de usuário" />
                <label for="nomeUsuario">
                  <i class="bi bi-person-fill me-2"></i>Nome de usuário
                </label>
              </div>

              <div class="form-floating col-12">
                <input type="password" class="form-control" id="senha" placeholder="Senha" />
                <label for="senha">
                  <i class="bi bi-lock-fill me-2"></i>Senha
                </label>
              </div>

              <div class="col-12 d-flex gap-2 mt-2">
                <button type="button" class="btn btn-success flex-grow-1"
                  onclick="window.location.href='cadastro-despesa.html'">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Login (Funcionário Demo)
                </button>
                <button type="button" class="btn btn-success flex-grow-1"
                  onclick="window.location.href='homepage-administrador.html'">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Login (Administrador Demo)
                </button>
              </div>

            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-primary text-white mt-auto py-4" data-bs-theme="dark">
    <div class="container text-center">
      <p class="small mb-0">© 2026 GDL, Inc • v1.0.0</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
