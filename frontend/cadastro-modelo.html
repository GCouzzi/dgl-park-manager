<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">E-Estacionamento</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Cadastros</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Processos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Relatórios</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container-fluid flex-grow-1 d-flex flex-column">
      <div class="row flex-grow-1">
        <aside
          class="col-12 col-md-2 col-xl-3 col-xxl-2 border-end border-1 mb-5 mb-md-0"
        >
          <nav class="d-flex flex-column gap-2 mt-5">
            <a href="cadastro-modelo.html" class="btn btn-primary">
              <i class="bi bi-plus-circle-fill me-2"></i>Inserir
            </a>
            <a href="#" class="btn btn-primary">
              <i class="bi bi-search me-2"></i>Buscar
            </a>
            <a href="#" class="btn btn-primary">
              <i class="bi bi-list-ul me-2"></i>Listar
            </a>
          </nav>
        </aside>
        <section class="col-12 col-md-10 col-xl-9 col-xxl-10 p-5">
          <form method="post">
            <div class="card shadow-sm">
              <div class="card-header p-4 bg-primary text-white">
                <h1 class="display-6">Inserir Modelo</h1>
              </div>
              <div class="card-body col-12">
                <div class="row g-3">
                  <div class="form-floating col-12">
                    <input
                      type="text"
                      class="form-control"
                      id="nome"
                      placeholder="Nome"
                    />
                    <label for="nome"
                      ><i class="bi bi-person-fill me-2"></i>Nome</label
                    >
                  </div>

                  <div class="form-floating col-12">
                    <input
                      type="number"
                      class="form-control"
                      id="ano"
                      placeholder="Ano"
                    />
                    <label for="ano"
                      ><i class="bi bi-calendar-fill me-2"></i>Ano</label
                    >
                  </div>

                  <div class="form-floating col-12">
                    <input
                      type="text"
                      class="form-control"
                      id="marca"
                      placeholder="Marca"
                    />
                    <label for="marca"
                      ><i class="bi bi-tag-fill me-2"></i>Marca</label
                    >
                  </div>
                </div>
              </div>
            </div>
          </form>
        </section>
      </div>
    </main>

    <footer class="py-3 bg-primary mt-auto" data-bs-theme="dark">
      <ul
        class="nav justify-content-center border-bottom border-primary-subtle shadow-sm pb-3 mb-3 flex-sm-row flex-column align-items-center"
      >
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-white">Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-white">Cadastros</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-white">Processos</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-white">Relatórios</a>
        </li>
      </ul>
      <p class="text-center text-white">© 2026 GDL, Inc</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
