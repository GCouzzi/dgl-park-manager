<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veículo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">E-Estacionamento</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                Cadastros
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="cadastro-modelo.html">Modelo</a></li>
                <li><a class="dropdown-item active" href="cadastro-veiculo.html">Veículo</a></li>
                <li><a class="dropdown-item" href="cadastro-despesa.html">Despesa</a></li>
              </ul>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                Processos
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Saída</a></li>
              </ul>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                Relatórios
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Relatório 1</a></li>
                <li><a class="dropdown-item" href="#">Relatório 2</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-fluid flex-grow-1 d-flex flex-column">
    <div class="row flex-grow-1">
      <aside class="col-12 col-md-2 col-xl-3 col-xxl-2 border-end border-1 mb-5 mb-md-0">
        <nav class="d-flex flex-column gap-2 mt-5">
          <a href="cadastro-veiculo.html" class="btn btn-primary">
            <i class="bi bi-plus-circle-fill me-2"></i>Inserir
          </a>
          <a href="listar-veiculo.html" class="btn btn-primary">
            <i class="bi bi-list-ul me-2"></i>Listar
          </a>
          <a href="buscar-veiculo.html" class="btn btn-primary active">
            <i class="bi bi-search me-2"></i>Buscar
          </a>
        </nav>
      </aside>

      <section class="col-12 col-md-10 col-xl-9 col-xxl-10 p-5">
        <div class="card shadow-sm">
          <div class="card-header p-4 bg-primary text-white">
            <h1 class="display-6">Buscar Veículo</h1>
          </div>
          <div class="card-body">

            <form method="post">
              <div class="row g-2 mb-4">
                <div class="col-12 col-md-8 col-lg-6">
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-car-front-fill"></i>
                    </span>
                    <input type="text" class="form-control" id="placa" name="placa"
                      placeholder="Digite a placa do veículo" />
                    <button type="button" class="btn btn-primary">
                      <i class="bi bi-search me-1"></i>Buscar
                    </button>
                    <button type="reset" class="btn btn-outline-secondary">
                      Limpar
                    </button>
                  </div>
                </div>
              </div>
            </form>

            <div class="card border">
              <div class="card-header bg-light">
                <h6 class="mb-0 text-muted">Resultado da busca</h6>
              </div>
              <div class="card-body">
                <div class="row g-3">

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-car-front-fill me-1 text-primary"></i>Placa
                    </label>
                    <input type="text" class="form-control" value="ABC-1234" readonly />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-building me-1 text-primary"></i>Marca
                    </label>
                    <input type="text" class="form-control" value="Honda" readonly />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-car-front me-1 text-primary"></i>Modelo
                    </label>
                    <input type="text" class="form-control" value="Civic" readonly />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-calendar me-1 text-primary"></i>Ano
                    </label>
                    <input type="text" class="form-control" value="2022" readonly />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-palette-fill me-1 text-primary"></i>Cor
                    </label>
                    <input type="text" class="form-control" value="Preto" readonly />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-shield-fill-exclamation me-1 text-primary"></i>Banido
                    </label>
                    <div class="form-control d-flex align-items-center gap-2">
                      <span class="badge bg-danger">Sim</span>
                    </div>
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-exclamation-circle-fill me-1 text-primary"></i>Motivo
                    </label>
                    <textarea class="form-control" rows="3"
                      readonly>Veículo com débitos pendentes e histórico de infrações no estacionamento.</textarea>
                  </div>

                  <div class="col-12">
                    <hr />
                    <button type="button" class="btn btn-danger">
                      <i class="bi bi-trash me-2"></i>Excluir Veículo
                    </button>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="bg-primary text-white mt-auto py-4" data-bs-theme="dark">
    <div class="container text-center">
      <p class="small mb-0">© 2026 GDL, Inc • v1.0.0</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
