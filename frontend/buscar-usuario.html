<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuário — E-Estacionamento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="login.html">E-Estacionamento</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="homepage-administrador.html">Home</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                Cadastros
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item active" href="cadastro-usuario.html">Usuário</a></li>
                <li><a class="dropdown-item" href="cadastro-despesa.html">Despesa</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                Relatórios
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="relatorio-financeiro.html">Financeiro</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-fluid flex-grow-1 d-flex flex-column">
    <div class="row flex-grow-1">

      <aside class="col-12 col-md-2 col-xl-3 col-xxl-2 border-end border-1 mb-5 mb-md-0">
        <nav class="d-flex flex-column gap-2 mt-5">
          <a href="cadastro-usuario.html" class="btn btn-primary text-start">
            <i class="bi bi-plus-circle-fill me-2"></i>Inserir
          </a>
          <a href="listar-usuario.html" class="btn btn-primary text-start">
            <i class="bi bi-list-ul me-2"></i>Listar
          </a>
        </nav>
      </aside>

      <section class="col-12 col-md-10 col-xl-9 col-xxl-10 p-5">
        <div class="card shadow-sm">
          <div class="card-header p-4 bg-primary text-white">
            <h1 class="display-6">Alterar Usuário</h1>
          </div>
          <div class="card-body">
            <div class="card border">
              <div class="card-body">
                <div class="row g-3">

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-person-fill me-1 text-primary"></i>Nome de Usuário
                    </label>
                    <input type="text" class="form-control" value="João Silva" />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-card-text me-1 text-primary"></i>CPF
                    </label>
                    <input type="text" class="form-control" value="123.456.789-00" />
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-geo-alt-fill me-1 text-primary"></i>Endereço
                    </label>
                    <input type="text" class="form-control" value="Rua das Flores, 123" />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-telephone-fill me-1 text-primary"></i>Telefone
                    </label>
                    <input type="text" class="form-control" value="(11) 99999-0000" />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-shield-lock-fill me-1 text-primary"></i>Tipo
                    </label>
                    <select class="form-select">
                      <option value="funcionario">Funcionário</option>
                      <option value="administrador" selected>Administrador</option>
                    </select>
                  </div>

                  <!-- Alteração de senha -->
                  <div class="col-12">
                    <hr />
                    <h6 class="text-muted">Alterar senha</h6>
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-lock-fill me-1 text-primary"></i>Nova senha
                    </label>
                    <input type="password" class="form-control" placeholder="Digite a nova senha" />
                  </div>

                  <div class="col-12 col-md-6">
                    <label class="form-label fw-semibold">
                      <i class="bi bi-lock-fill me-1 text-primary"></i>Confirmar senha
                    </label>
                    <input type="password" class="form-control" placeholder="Confirme a nova senha" />
                  </div>

                  <div class="col-12">
                    <hr />
                    <button type="button" class="btn btn-success me-2">
                      <i class="bi bi-save me-2"></i>Salvar
                    </button>
                    <button type="button" class="btn btn-danger">
                      <i class="bi bi-trash me-2"></i>Excluir Usuário
                    </button>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="bg-primary text-white mt-auto py-4" data-bs-theme="dark">
    <div class="container text-center">
      <p class="small mb-0">© 2026 GDL, Inc • v1.0.0</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
