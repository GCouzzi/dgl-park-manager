<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuário — E-Estacionamento</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>

<body class="d-flex flex-column min-vh-100">
  <header>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="login.html">E-Estacionamento</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle active" href="#" data-bs-toggle="dropdown">
                Cadastros
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item active" href="cadastro-usuario.html">Usuário</a></li>
                <li><a class="dropdown-item" href="cadastro-despesa.html">Despesa</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                Relatórios
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="relatorio-financeiro.html">Financeiro</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container-fluid flex-grow-1 d-flex flex-column">
    <div class="row flex-grow-1">

      <aside class="col-12 col-md-2 col-xl-3 col-xxl-2 border-end border-1 mb-5 mb-md-0">
        <nav class="d-flex flex-column gap-2 mt-5">
          <a href="cadastro-usuario.html" class="btn btn-primary active text-start">
            <i class="bi bi-plus-circle-fill me-2"></i>Inserir
          </a>
          <a href="listar-usuario.html" class="btn btn-primary text-start">
            <i class="bi bi-list-ul me-2"></i>Listar
          </a>
        </nav>
      </aside>

      <section class="col-12 col-md-10 col-xl-9 col-xxl-10 p-5">
        <form method="post">
          <div class="card shadow-sm">
            <div class="card-header p-4 bg-primary text-white">
              <h1 class="display-6">Inserir Usuário</h1>
            </div>

            <div class="card-body">
              <div class="row g-3">

                <div class="form-floating col-12">
                  <input type="text" class="form-control" id="nomeUsuario" placeholder="Nome de Usuário" />
                  <label for="nomeUsuario">
                    <i class="bi bi-person-fill me-2"></i>Nome de usuário
                  </label>
                </div>

                <div class="form-floating col-12">
                  <input type="password" class="form-control" id="senha" placeholder="Senha" />
                  <label for="senha">
                    <i class="bi bi-lock-fill me-2"></i>Senha
                  </label>
                </div>

                <div class="form-floating col-12">
                  <input type="text" class="form-control" id="cpf" placeholder="CPF" maxlength="14" />
                  <label for="cpf">
                    <i class="bi bi-card-text me-2"></i>CPF
                  </label>
                </div>

                <div class="form-floating col-12">
                  <input type="tel" class="form-control" id="telefone" placeholder="Telefone" />
                  <label for="telefone">
                    <i class="bi bi-telephone-fill me-2"></i>Telefone
                  </label>
                </div>

                <div class="form-floating col-12">
                  <input type="text" class="form-control" id="endereco" placeholder="Endereço" />
                  <label for="endereco">
                    <i class="bi bi-card-text me-2"></i>Endereço
                  </label>
                </div>

                <div class="form-floating col-12">
                  <select class="form-select" id="tipo">
                    <option selected disabled>Selecione o tipo de usuário</option>
                    <option value="funcionario">Funcionário</option>
                    <option value="administrador">Administrador</option>
                  </select>
                  <label for="tipo">
                    <i class="bi bi-shield-fill me-2"></i>Tipo
                  </label>
                </div>

                <div class="col-12">
                  <button type="button" class="btn btn-success w-100">
                    <i class="bi bi-save me-2"></i>Salvar
                  </button>
                </div>

                <div class="col-12">
                  <button type="reset" class="btn btn-warning w-100">
                    <i class="bi bi-x-circle me-2"></i>Limpar
                  </button>
                </div>

              </div>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="bg-primary text-white mt-auto py-4" data-bs-theme="dark">
    <div class="container text-center">
      <p class="small mb-0">© 2026 GDL, Inc • v1.0.0</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
